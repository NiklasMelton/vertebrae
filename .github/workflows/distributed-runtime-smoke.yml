name: Distributed Runtime Smoke Tests

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: Extra pytest args, for example '-k ray'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  distributed-runtime-smoke:
    name: Ray/Dask local runtime smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install distributed dependencies
        run: poetry install --no-interaction --with dev --extras distributed

      - name: Run distributed runtime smoke tests
        env:
          VERTABRAE_RUN_DISTRIBUTED_RUNTIME: "1"
          RAY_DISABLE_IMPORT_WARNING: "1"
        run: poetry run pytest -m distributedruntime ${{ inputs.pytest_args }}
