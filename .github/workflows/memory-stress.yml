name: Memory Stress Tests

on:
  workflow_dispatch:
    inputs:
      pytest_args:
        description: Extra pytest args, for example '-k subsample'
        required: false
        default: ""

permissions:
  contents: read

jobs:
  memory-stress:
    name: Memory stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run memory stress tests
        env:
          VERTABRAE_RUN_MEMORY_STRESS: "1"
        run: poetry run pytest -m memorystress ${{ inputs.pytest_args }}
