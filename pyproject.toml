[tool.poetry]
name = "vertebrae"
version = "0.1.0"
description = "Benchmark feature extractors and transfer-learning backbones using OverlapIndex."
authors = ["Niklas Melton <niklasmelton@gmail.com>"]
readme = "README.md"
packages = [{ include = "vertebrae", from = "src" }]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=2.0,<3.0"
scikit-learn = "^1.5"
pandas = "^2.2"
joblib = "^1.3"
pydantic = "^2.0"
overlapindex = ">=0.1.1"
transformers = { version = "^4.0", optional = true }
datasets = { version = "^2.0", optional = true }
torch = { version = ">=2.0", optional = true }
sentence-transformers = { version = "^3.0", optional = true }
pillow = { version = "^10.0", optional = true }

[tool.poetry.extras]
hf = ["transformers", "datasets", "torch", "sentence-transformers", "pillow"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"
mypy = "^1.0"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
